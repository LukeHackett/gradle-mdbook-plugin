[versions]
shadow-jar = "9.6.1"
publish = "2.2.1"
mockk = "1.14.11"
archunit = "1.5.1"
junit = "6.1.3"
detekt = "2.0.0-alpha.6"
kover = "0.9.11"
ktfmt = "0.27.0"

[plugins]
shadow-jar = { id = "com.gradleup.shadow", version.ref = "shadow-jar" }
publish = { id = "com.gradle.plugin-publish", version.ref = "publish" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
ktfmt = { id = "com.ncorti.ktfmt.gradle", version.ref = "ktfmt" }

[libraries]
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
archunit-junit6 = { module = "com.tngtech.archunit:archunit-junit6", version.ref = "archunit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit" }

[bundles]
junit = ["junit-jupiter-api", "junit-jupiter-engine"]
