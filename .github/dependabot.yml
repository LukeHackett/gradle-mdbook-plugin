version: 2

updates:
  # GitHub Actions versions
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 5
    schedule:
      interval: "weekly"
      day: sunday
      time: "08:00"
      timezone: "Europe/London"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"

  # Gradle dependencies (libs.versions.toml + build.gradle.kts)
  - package-ecosystem: gradle
    directory: /
    open-pull-requests-limit: 10
    schedule:
      interval: "weekly"
      day: sunday
      time: "08:00"
      timezone: "Europe/London"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
    groups:
      test:
        patterns:
          - "org.junit.*"
          - "io.mockk:*"
          - "com.tngtech.archunit:*"
      code-quality:
        patterns:
          - "dev.detekt"
          - "com.ncorti.ktfmt.gradle"
          - "org.jetbrains.kotlinx.kover"
      publish:
        patterns:
          - "com.gradleup.shadow"
          - "com.gradle.plugin-publish"
